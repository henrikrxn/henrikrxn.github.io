# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build site
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    branches:
      - '**'
  push:
    branches:
      - '**'
      - '!develop'
    paths:
      - '**'
      - '!.github/**/*.yml'
      - '.github/workflows/build-and-test.yml'
      - '!.markdownlint.json'
      - '!.vscode/**/*.json'
      - '!**/.editorconfig'
      - '!**/.gitignore'
jobs:
  build_and_run_tests:
    name: Build C# code and run tests
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false

    steps:
      - name: Dump Environment when running locally
        if: ${{ env.ACT }}
        run:  env | sort

      - name: Get the sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        id: dotnetsdk
        with:
          global-json-file: ./global.json

      - run: echo '${{ steps.dotnetsdk.outputs.dotnet-version }}'

      - name: Restore NuGet packages
        run: dotnet restore ./src/henrikrxn.github.io.slnx

      - name: Build solution
        run: dotnet build ./src/henrikrxn.github.io.slnx --configuration Release --no-restore

      - name: Run tests from solution
        run: dotnet test ./src/henrikrxn.github.io.slnx --no-restore --no-build
